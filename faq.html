"faq2_q": "Il mio file viene caricato da qualche parte?",
"faq2_a": "Nel preventivo indicativo no: l'analisi dello STEP o dell'STL avviene nel vostro browser e il file non viene caricato su nessun server.",
"faq3_q": "Quali file servono?",
"faq3_a": "Lo STEP del componente, o l'STL. Per un allestimento completo basta lo STEP AP242 dell'assieme, o il GLB, con i nomi delle parti a distinta: senza disegni 2D e senza impegnare il vostro ufficio tecnico.",
"faq4_q": "E se il disegno non c'è più?",
"faq4_a": "Si parte dal pezzo: rilievo 3D, reverse engineering, e il ricambio rientra a magazzino, digitale questa volta.",
"faq5_q": "Il pezzo è tracciato?",
"faq5_a": "Sì: lotto e job riportati sul pezzo di serie (Q2), e il certificato del produttore del materiale dove il capitolato lo chiede (Q3).",
"faq6_q": "Contatto alimentare e sterilizzazione?",
"faq6_a": "Il PA2200 ha biocompatibilità secondo ISO 10993-1 e USP classe VI, contatto alimentare secondo Reg. UE 10/2011 ed è compatibile con vapore, EtO e gamma, per dichiarazione del produttore. La validazione del vostro ciclo resta vostra.",
"faq7_q": "La superficie è all'altezza di un pezzo stampato?",
"faq7_a": "Dipende dalla finitura: da F0, grezzo tecnico, a F2, verniciato a liquido 2K a colore esatto, fino a F3, grado cleanroom. Con giochi sotto 0,3 mm l'accoppiamento tra particolari verniciati non si garantisce.",
"faq8_q": "E la classificazione al fuoco?",
"faq8_a": "Dove il capitolato la chiede si sale a Ultem 9085: UL94 V-0, FAR 25.853, EN 45545-2 a livello di materiale. Le prove sul componente finito si costruiscono insieme.",
"faq9_q": "Quando non conviene?",
"faq9_a": "Sotto la scala delle macchine da tavolo il pezzo ve lo fate in casa, e fate bene. Sopra i volumi da stampo torna lo stampo. E il ricambio strutturale in metallo resta in metallo: lo instradiamo alla nostra rete di partner.",
"o_t": "Preferite scriverci?",
"o_p": "Mandateci lo STEP o l'assieme per mail: vi rispondiamo con la fascia e, se serve, con quello che non conviene stampare."
},

"hf_t": "Die vier, die man uns zuerst stellt.",
"hf_link": "Alle Fragen",
"hf_ts": "Die Fragen aus Ihrer Branche.",
"faq0_q": "Ab wie vielen Teilen lohnt sich Additiv?",
"faq0_a": "Unterhalb der Amortisationsschwelle des Werkzeugs: Lose von eins bis fünfzig, Serien von Dutzenden oder Hunderten pro Jahr, Varianten je Kunde. Über Werkzeug-Stückzahlen kommt das Werkzeug zurück, und wir helfen beim Übergang.",

"faq1_a": "Die Richtpreisspanne wird sofort im Browser an Ihrer Datei berechnet. Bestätigt wird sie von einer Person, innerhalb von 24 Arbeitsstunden. Auf den realen Preis wirkt auch die Auslastung des Bauraums.",
"faq2_q": "Wird meine Datei irgendwo hochgeladen?",
"faq2_a": "Beim Richtpreis nicht: die Analyse des STEP oder der STL erfolgt in Ihrem Browser, die Datei wird auf keinen Server geladen.",
"faq3_q": "Welche Dateien brauchen Sie?",
"faq3_a": "Den STEP des Bauteils, oder die STL. Für einen kompletten Aufbau genügt der STEP AP242 der Baugruppe, oder das GLB, mit den Teilenamen der Stückliste: ohne 2D-Zeichnungen und ohne Ihre Konstruktion zu binden.",
"faq4_q": "Und wenn es keine Zeichnung mehr gibt?",
"faq4_a": "Wir gehen vom Teil aus: 3D-Scan, Reverse Engineering, und das Ersatzteil kommt zurück ins Lager, diesmal digital.",
"faq5_q": "Ist das Teil rückverfolgbar?",
"faq5_a": "Ja: Charge und Job auf dem Serienteil (Q2), und das Zertifikat des Werkstoffherstellers, wo das Lastenheft es verlangt (Q3).",

"faq6_a": "PA2200 hat Biokompatibilität nach ISO 10993-1 und USP Klasse VI, Lebensmittelkontakt nach VO (EU) 10/2011 und ist mit Dampf, EtO und Gamma verträglich, laut Herstellererklärung. Die Validierung Ihres Zyklus bleibt Ihre.",
"faq7_q": "Ist die Oberfläche wie bei einem Spritzgussteil?",
"faq7_a": "Das hängt von der Oberfläche ab: von F0, technisches Rohteil, über F2, 2K-Nasslack in exakter Farbe, bis F3, Reinraum-Grad. Bei Spielen unter 0,3 mm wird die Passung zwischen lackierten Teilen nicht garantiert.",
"faq8_q": "Und die Brandschutzklassifizierung?",
"faq8_a": "Wo das Lastenheft sie verlangt, geht es auf Ultem 9085: UL94 V-0, FAR 25.853, EN 45545-2 auf Werkstoffebene. Die Prüfungen am fertigen Bauteil bauen wir gemeinsam auf.",
"faq9_q": "Wann lohnt es sich nicht?",
"faq9_a": "Unterhalb der Desktop-Klasse drucken Sie das Teil selbst, und das ist richtig so. Über Werkzeug-Stückzahlen kommt das Werkzeug zurück. Und das strukturelle Metallteil bleibt Metall: wir leiten es an unser Partnernetz weiter.",
"o_t": "Lieber schreiben?",
"o_p": "Schicken Sie uns den STEP oder die Baugruppe per Mail: wir antworten mit der Spanne und, wenn nötig, mit dem, was sich nicht zu drucken lohnt."

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
let LANG=DPG_L();
const t=k=>I18N[LANG][k]??I18N.it[k]??k;
function applica(){
  document.documentElement.lang=LANG;document.title=t('titolo');$('meta[name="description"]').setAttribute('content',t('meta_d'));
  $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $$('[data-i-alt]').forEach(e=>e.alt=t(e.dataset.iAlt));
  $$('[data-i-href]').forEach(e=>e.href=t(e.dataset.iHref));
  $$('.lang').forEach(b=>{const on=b.dataset.lang===LANG;b.classList.toggle('attiva',on);b.setAttribute('aria-pressed',on);});
}
$$('.lang').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;applica();});
const oss=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vista');oss.unobserve(e.target);}}),{threshold:.12});
$$('.reveal').forEach(el=>oss.observe(el));
/* filtri: ogni elemento dichiara in data-set le sue voci; il conteggio sta sul pulsante */
function filtri(sel){
  const voci=[...$$(sel)],bott=[...$$('.filtro')];
  bott.forEach(b=>{const f=b.dataset.f,n=f==='tutti'?voci.length:voci.filter(v=>v.dataset.set.split(' ').includes(f)).length;b.querySelector('.n').textContent=n;});
  bott.forEach(b=>b.onclick=()=>{const f=b.dataset.f;bott.forEach(x=>x.setAttribute('aria-pressed',x===b));
    let vis=0;voci.forEach(v=>{const on=f==='tutti'||v.dataset.set.split(' ').includes(f);v.hidden=!on;vis+=on;});
    const vu=$('.nessuna');if(vu)vu.hidden=vis>0;
    if(history.replaceState)history.replaceState(null,'',f==='tutti'?location.pathname:'#'+f);});
  const h=location.hash.slice(1);const b=bott.find(x=>x.dataset.f===h);if(b)b.click();
}

if(location.hash.startsWith('#faq-')){const d=$(location.hash);if(d)d.open=true;}
applica();
</script>
