"titolo":"Macchine industriali e OEM · Due Pi Greco",
"meta_d":"Produzione additiva per costruttori di macchine e impianti: lotti da uno a cinquanta, varianti per cliente, ricambi del parco installato, senza stampi.",
"set":"Settore 01 · Macchine industriali e OEM",
"h1":"La vostra produzione è già una serie piccola.",
"intro":"Ogni macchina è una commessa: lotti da uno a cinquanta, varianti per ogni cliente, ricambi da garantire per vent'anni. Nessuno stampo si ammortizza su numeri così. Guardate la vostra macchina: le parti in rosso, oggi, si producono meglio in additive.",
"s1p":"Il componente in plastica della vostra macchina oggi passa da uno stampo che non si ripaga, da un minimo d'ordine che riempie uno scaffale, o da una lavorazione dal pieno che costa come il gruppo che serve. E ogni variante ricomincia il giro.",
"s1q":"Siamo a Treviso, non dietro un configuratore: il primo articolo lo discutiamo al vostro banco, e per un lotto piccolo siamo dimensionati per lavorarci con margine, non per tollerarlo.",
"b1t":"Serie piccole senza stampi",
"b1p":"Sotto la soglia di ammortamento dell'attrezzatura, il pezzo stampato perde. Si produce alla firma dell'ordine: capitale libero, nessun minimo.",
"b1g":"costo per pezzo stabile dal n° 1 al n° 50",
"b2t":"Varianti per cliente, a costo di file",
"b2p":"La versione per il cliente tedesco e quella per il francese sono due file, non due attrezzaggi. La modifica entra in produzione in giorni.",
"b2g":"nessun riattrezzaggio · revisioni in tempo reale",
"b3t":"Ricambi e magazzino digitale",
"b3p":"L'obbligo ricambi non invecchia a scaffale: si riordina quando serve, identico al lotto precedente, perché il lotto è tracciato. A disegno perduto: rilievo 3D e reverse engineering.",
"b3g":"tracciabilità di lotto · riordino identico",
"b4t":"Consolidamento e peso",
"b4p":"Gruppi multipezzo diventano monoblocco: meno assemblaggio, meno codici a distinta, meno punti di guasto. E la poliammide pesa un terzo dell'alluminio.",
"b4g":"canali e funzioni integrati nel corpo",

"dida2":"Geometrie disegnate da noi, non macchine di un costruttore. In rosso: le parti che si producono in additive.",
"d_nota":"Materiale e finitura sono indicativi: si confermano insieme, sul vostro disegno. La scala da F0 a F3 è spiegata più sotto.",
"m1":"il tuttofare della serie: da −40 a +80 °C sotto carico, sterilizzabile; sulle linee alimentari, con dichiarazione di conformità al contatto (Reg. UE 10/2011). Non è ignifugo: UL94 HB",
"m2n":"Polipropilene",
"m2":"chimica di acidi, basi e detergenti; serie medie e alte. Capacità a programma: la disponibilità si verifica sulla commessa",

"m4":"interfacce di presa cedevoli, antiscivolo; contatto pelle, non prodotto; limite pratico intorno a 70 °C",

"c1t":"Filtrazione industriale: pannelli in serie ricorrente",
"c1p":"Per un costruttore di sistemi di filtrazione industriale produciamo in continuativo pannelli tecnici in polipropilene sinterizzato: serie ricorrente, riordino a magazzino digitale, lotto tracciato. Non un prototipo: una fornitura.",
"c2t":"Forni professionali: cassetti e profili in lotti piccoli",
"c2p":"Per un costruttore di forni professionali produciamo in serie ricorrente cassetti e profili raccogligocce in PA2200: componenti a contatto con il prodotto, pareti da 2,5 mm, riordinati in lotti piccoli, lotto tracciato.",
"rov_p":"Sotto la scala delle macchine da tavolo, il pezzo ve lo fate in casa e fate bene. Sopra i volumi da stampo, torna lo stampo, e vi aiutiamo noi a fare il passaggio. E il ricambio strutturale in metallo resta in metallo: quando serve, lo instradiamo alla nostra rete di partner qualificati.",

"titolo":"Maschinenbau und OEM · Due Pi Greco",
"meta_d":"Additive Fertigung für Maschinen- und Anlagenbauer: Lose von eins bis fünfzig, Varianten je Kunde, Ersatzteile für den Maschinenpark, ohne Werkzeuge.",
"set":"Branche 01 · Maschinenbau und OEM",
"h1":"Ihre Produktion ist bereits eine Kleinserie.",
"intro":"Jede Maschine ist ein Auftrag: Lose von eins bis fünfzig, Varianten je Kunde, Ersatzteilpflicht über zwanzig Jahre. Kein Werkzeug amortisiert sich bei solchen Stückzahlen. Sehen Sie Ihre Maschine an: die Teile in Rot werden heute besser additiv gefertigt.",
"s1p":"Das Kunststoffteil Ihrer Maschine läuft heute über ein Werkzeug, das sich nicht rechnet, über eine Mindestmenge, die ein Regal füllt, oder über eine Fräsung aus dem Vollen, die so viel kostet wie die Baugruppe, der sie dient. Und jede Variante beginnt die Runde von vorn.",
"s1q":"Wir stehen nicht hinter einem Konfigurator: das Erstmuster besprechen wir gemeinsam an der Zeichnung, auf Italienisch, Deutsch oder Englisch. Und für kleine Lose sind wir dimensioniert, um damit wirtschaftlich zu arbeiten, nicht um sie zu dulden.",
"b1t":"Kleinserien ohne Werkzeuge",
"b1p":"Unter der Amortisationsschwelle des Werkzeugs verliert das Spritzteil. Produziert wird bei Auftragseingang: Kapital bleibt frei, keine Mindestmenge.",
"b1g":"Stückkosten stabil von Nr. 1 bis Nr. 50",
"b2t":"Varianten je Kunde, zum Preis einer Datei",
"b2p":"Die Version für den deutschen und die für den französischen Kunden sind zwei Dateien, nicht zwei Werkzeuge. Die Änderung geht in Tagen in Produktion.",
"b2g":"kein Umrüsten · Revisionen in Echtzeit",
"b3t":"Ersatzteile und digitales Lager",
"b3p":"Die Ersatzteilpflicht altert nicht im Regal: nachbestellt wird bei Bedarf, identisch zum letzten Los, weil das Los rückverfolgbar ist. Ohne Zeichnung: 3D-Aufnahme und Reverse Engineering.",
"b3g":"Chargenrückverfolgung · identische Nachbestellung",
"b4t":"Konsolidierung und Gewicht",
"b4p":"Mehrteilige Baugruppen werden monolithisch: weniger Montage, weniger Positionen, weniger Fehlerquellen. Und Polyamid wiegt ein Drittel des Aluminiums.",
"b4g":"Kanäle und Funktionen im Körper integriert",
"k1":"GEHÄUSE UND ABDECKUNGEN",
"k2":"HALTER UND STÜTZEN",

"s2o":"In der Maschine",
"s2t":"Wo die additiven Teile sitzen",
"s2p":"Drei Teilefamilien, die sich mit dem Format, dem Auftrag und dem Kunden ändern: der Formatwechsel, das Greifen mit seinen Vorrichtungen, die Gehäuse mit ihren Ersatzteilen. Die Nummern auf den Zeichnungen verweisen auf die jeweilige Stückliste darunter.",

"dida2":"Von uns gezeichnete Geometrien, keine Maschinen eines Herstellers. In Rot: die Teile, die additiv gefertigt werden.",
"d_nota":"Material und Oberfläche sind Richtwerte: bestätigt werden sie gemeinsam, an Ihrer Zeichnung. Die Skala von F0 bis F3 ist weiter unten erklärt.",
"m1":"der Allrounder der Serie: −40 bis +80 °C unter Last, sterilisierbar; an Lebensmittellinien mit Konformitätserklärung für den Lebensmittelkontakt (VO (EU) Nr. 10/2011). Nicht flammhemmend: UL94 HB",
"m2n":"Polypropylen",
"m2":"Chemie von Säuren, Laugen und Reinigern; mittlere und große Serien. Kapazität nach Programm: die Verfügbarkeit klären wir am Auftrag",
"m3":"Vorrichtungen und Halter: extreme Steifigkeit bei minimalem Gewicht",
"m4":"nachgiebige Greifflächen, rutschhemmend; Hautkontakt, kein Produktkontakt; praktische Grenze um 70 °C",
"m5":"Gehäuse, wo eine Brandklassifizierung verlangt ist: UL94 V-0 auf Materialebene, nicht am Bauteil; den Qualifizierungsweg am Bauteil erarbeiten wir gemeinsam",

"c1t":"Industrielle Filtration: Paneele in wiederkehrender Serie",
"c1p":"Für einen Hersteller industrieller Filtrationssysteme fertigen wir laufend technische Paneele aus gesintertem Polypropylen: wiederkehrende Serie, Nachbestellung aus dem digitalen Lager, rückverfolgtes Los. Kein Prototyp: eine Lieferung.",
"c2t":"Professionelle Öfen: Schubladen und Profile in kleinen Losen",
"c2p":"Für einen Hersteller professioneller Öfen fertigen wir in wiederkehrender Serie Auffangschubladen und Abtropfprofile aus PA2200: Bauteile mit Produktkontakt, Wandstärke 2,5 mm, in kleinen Losen nachbestellt, rückverfolgtes Los.",
"rov_p":"Unterhalb der Desktop-Klasse drucken Sie das Teil selbst, und das ist richtig so. Oberhalb der Werkzeug-Stückzahlen gehört es zurück ins Werkzeug, und beim Übergang helfen wir. Und das strukturelle Metallteil bleibt Metall: wenn es soweit ist, leiten wir es an unser Netz qualifizierter Partner weiter.",

/* ---- modello fascia (coefficienti calibrati, ago 2026): identico allo stampo, la calibrazione e' il pezzo F-12.
        Cambia solo l'ordine dei materiali: prima quelli del comparto (Lib 03 par. 8). ---- */
const M={sls:{a:0.50006,b:19.023,fissi:[48,65,83,100,118,135,153,170],quota:0.125,
  camera:{x:700,y:380,z:580},min:90,
  mat:{'PA2200':{ok:true},'TPU 90A':{ok:false},'PA11':{ok:false}}},
 fdm:{fisso:96,camera:{x:914,y:610,z:914},min:120,
  mat:{'Nylon 12CF':{ok:true,cm3:0.601},'Ultem 1010 CG':{ok:true,cm3:0.686},'Ultem 9085':{ok:true,cm3:0.621}}},
 fasce:[[1,1.0],[50,0.88],[100,0.80]],banda:[0.88,1.12]};
const ceil10=x=>Math.ceil((x-1e-9)/10)*10;
const kQ=q=>{let k=1;for(const[s,v]of M.fasce)if(q>=s)k=v;return k;};
function centrale(vol,x,y,z,tec,mat){
  if(tec==='SLS'){
    const d=[x,y,z].sort((p,q)=>q-p);
    const vb=Math.max(60,d[0])*Math.max(60,d[1])*Math.max(30,d[2]);
    const occ=vb/(M.sls.camera.x*M.sls.camera.y*M.sls.camera.z);
    const i=Math.min(M.sls.fissi.length-1,Math.max(0,Math.ceil(occ/M.sls.quota-1e-9)-1));
    return Math.max(M.sls.min,M.sls.fissi[i]+M.sls.a*vol+M.sls.b*vb/1e6);
  }
  return Math.max(M.fdm.min,M.fdm.fisso+M.fdm.mat[mat].cm3*vol);
}
function fascia(vol,x,y,z,tec,mat,q){
  const c=centrale(vol,x,y,z,tec,mat)*kQ(q);
  return{lo:ceil10(c*M.banda[0]),hi:ceil10(c*M.banda[1])};
}
const eurF=x=>x.toLocaleString({it:'it-IT',de:'de-DE',en:'en-IE'}[LANG],{maximumFractionDigits:0});

/* ---- parser STL: identico allo stampo ---- */
function parseSTL(buf){
  if(buf.byteLength>100*1024*1024)throw 0;
  const dv=new DataView(buf);let tris;
  const head=new TextDecoder().decode(buf.slice(0,Math.min(400,buf.byteLength)));
  const n=buf.byteLength>=84?dv.getUint32(80,true):0;
  if(buf.byteLength>=84&&84+n*50===buf.byteLength){
    if(n>3e6)throw 0;tris=new Float32Array(n*9);
    for(let i=0;i<n;i++){let o=84+i*50+12;for(let k=0;k<9;k++)tris[i*9+k]=dv.getFloat32(o+k*4,true);}
  }else if(/facet/i.test(head)){
    const m=new TextDecoder().decode(buf).match(/vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g)||[];
    if(m.length/3>3e6)throw 0;tris=new Float32Array(m.length*3);
    m.forEach((v,i)=>{const p=v.split(/\s+/);tris[i*3]=+p[1];tris[i*3+1]=+p[2];tris[i*3+2]=+p[3];});
  }else throw 0;
  let vol=0,mn=[1e30,1e30,1e30],mx=[-1e30,-1e30,-1e30];
  for(let i=0;i<tris.length/9;i++){
    const a=tris.subarray(i*9,i*9+3),b=tris.subarray(i*9+3,i*9+6),c=tris.subarray(i*9+6,i*9+9);
    vol+=(a[0]*(b[1]*c[2]-b[2]*c[1])-a[1]*(b[0]*c[2]-b[2]*c[0])+a[2]*(b[0]*c[1]-b[1]*c[0]))/6;
    for(const p of[a,b,c])for(let k=0;k<3;k++){if(p[k]<mn[k])mn[k]=p[k];if(p[k]>mx[k])mx[k]=p[k];}
  }
  vol=Math.abs(vol)/1000;if(vol<0.001)throw 0;
  return{vol:+vol.toFixed(1),x:Math.round(mx[0]-mn[0]),y:Math.round(mx[1]-mn[1]),z:Math.round(mx[2]-mn[2])};
}

const num=(s,d=0)=>{const v=parseFloat($(s).value);return isFinite(v)?v:d;};
function materiali(){
  const tab=TEC==='SLS'?M.sls.mat:M.fdm.mat;
  $('#q_mat').innerHTML=Object.keys(tab).map(m=>`<option>${m}</option>`).join('');

/* la mail resta in italiano: la legge l'ufficio DPG */
function mailto(vol,x,y,z,q,mat,f){
  const corpo=[NOMEFILE?`File: ${NOMEFILE}`:null,
    ESITO&&ESITO.tipo==='es'?'Pezzo: esempio della pagina (carter)':null,
    `Settore: macchine industriali e OEM`,
    `Volume: ${vol} cm3 · Ingombro: ${x}x${y}x${z} mm`,
    `Tecnologia: ${TEC} · Materiale: ${mat} · Quantità: ${q}`,
    f?`Fascia indicata: ${f.lo}..${f.hi} EUR/pezzo`:`Fascia: su richiesta`,
    '','Generato da DPG-WEB Rev. 03 (demo)'].filter(Boolean).join('\n');
  return `mailto:info@duepigreco3d.it?subject=${encodeURIComponent(t('mail_sub'))}&body=${encodeURIComponent(corpo)}`;
}
function esito(){
  const e=$('#q_ok');
  if(!ESITO){e.textContent='';return;}
  e.textContent=ESITO.tipo==='file'?`${ESITO.nome} · ${ESITO.vol} cm³ · ${t('file_ok')}`:ESITO.tipo==='es'?t('es_ok'):t('err_stl');
}
function aggiorna(){
  statoFin(STATO);esito();
  const vol=num('#q_vol'),x=num('#q_x'),y=num('#q_y'),z=num('#q_z'),q=Math.max(1,num('#q_q',1));
  const mat=$('#q_mat').value;const cta=$('#q_cta');
  if(!(vol>0&&x>0&&y>0&&z>0)){
    $('#q_v').textContent='·';$('#q_u').textContent=t('compila');
    $('#q_tab').innerHTML='';cta.style.opacity=.4;cta.setAttribute('aria-disabled','true');
    cta.textContent=t('cta');cta.href='#quotazione';return;
  }
  const attivo=(TEC==='SLS'?M.sls.mat:M.fdm.mat)[mat]?.ok;
  cta.style.opacity=1;cta.removeAttribute('aria-disabled');
  if(!attivo){
    $('#q_v').textContent='·';$('#q_u').textContent=t('surich');
    $('#q_tab').innerHTML='';cta.textContent=t('cta_req');cta.href=mailto(vol,x,y,z,q,mat,null);return;
  }
  const f=fascia(vol,x,y,z,TEC,mat,q);
  $('#q_v').textContent=`${eurF(f.lo)} .. ${eurF(f.hi)} €`;
  $('#q_u').textContent=`× ${q}`;
  $('#q_tab').innerHTML=`<tr><th>${t('f_q')}</th><th class="num">${t('f_f')}</th></tr>`+
    M.fasce.map(([s])=>{const ff=fascia(vol,x,y,z,TEC,mat,s);
      return `<tr><td>${s===1?'1':t('da')+' '+s}</td><td class="num">${eurF(ff.lo)} .. ${eurF(ff.hi)} €</td></tr>`;}).join('');
  cta.textContent=t('cta');cta.href=mailto(vol,x,y,z,q,mat,f);
}

  TEC=b.dataset.t;$$('.tec').forEach(x=>{x.classList.toggle('attiva',x===b);x.setAttribute('aria-pressed',x===b);});

const dz=$('#q_drop');
['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('sopra');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('sopra');}));
async function leggi(file){
  try{const r=parseSTL(await file.arrayBuffer());NOMEFILE=file.name;
    $('#q_vol').value=r.vol;$('#q_x').value=r.x;$('#q_y').value=r.y;$('#q_z').value=r.z;
    ESITO={tipo:'file',nome:file.name,vol:r.vol};aggiorna();
  }catch(_){ESITO={tipo:'err'};esito();}}
function scegli(){const i=document.createElement('input');i.type='file';i.accept='.stl';
  i.onchange=()=>i.files[0]&&leggi(i.files[0]);i.click();}
dz.addEventListener('drop',e=>{if(e.dataTransfer.files[0])leggi(e.dataTransfer.files[0]);});
dz.addEventListener('click',scegli);
dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();scegli();}});
